<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-pak anam, initial-scale=1, viewport-fit=cover">
<title>toko pak anam</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;800&display=swap">
<style>
:root{--bg:#eef1f4;--sf:#fff;--ink:#14202b;--mut:#5d6b78;--ln:#d9e0e6;--ac:#0f6e8c;--acx:#fff;--go:#f2b200;--gox:#2b2000;--bad:#b3261e;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0f1519;--sf:#182027;--ink:#e8eef3;--mut:#93a3b0;--ln:#2a3640;--ac:#4cb8d8;--acx:#06222c;--bad:#ff8a80;color-scheme:dark}}
:root[data-theme="dark"]{--bg:#0f1519;--sf:#182027;--ink:#e8eef3;--mut:#93a3b0;--ln:#2a3640;--ac:#4cb8d8;--acx:#06222c;--bad:#ff8a80;color-scheme:dark}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.45 "Plus Jakarta Sans",system-ui,-apple-system,"Segoe UI",sans-serif}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--ac);outline-offset:2px}
header{display:flex;align-items:center;gap:12px;padding:12px 16px;background:var(--sf);border-bottom:1px solid var(--ln);flex-wrap:wrap}
header h1{font-size:18px;font-weight:800;margin:0;margin-right:auto}
nav{display:flex;gap:4px}
nav button{border:0;background:none;padding:8px 14px;border-radius:8px;font-weight:600;color:var(--mut)}
nav button[aria-selected="true"]{background:var(--ac);color:var(--acx)}
main{max-width:1100px;margin:0 auto;padding:16px}
.kasir{display:grid;grid-template-columns:1fr 360px;gap:16px;align-items:start}
@media(max-width:820px){.kasir{grid-template-columns:1fr}}
.panel{background:var(--sf);border:1px solid var(--ln);border-radius:10px;padding:14px}
.bar{display:flex;gap:8px;margin-bottom:12px;flex-wrap:wrap}
input,select{background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:9px 11px;min-width:0}
.bar input{flex:1;min-width:140px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:10px}
.item{text-align:left;background:var(--bg);border:1px solid var(--ln);border-radius:8px;padding:10px;display:flex;flex-direction:column;gap:2px;min-height:84px}
.item:hover:not(:disabled){border-color:var(--ac)}
.item:disabled{opacity:.45;cursor:not-allowed}
.item b{font-weight:600}.item .p{color:var(--ac);font-weight:800}.item small{color:var(--mut)}
.row{display:flex;align-items:center;gap:8px;padding:8px 0;border-bottom:1px solid var(--ln)}
.row .n{flex:1;min-width:0}.row .n small{display:block;color:var(--mut)}
.q{display:flex;align-items:center;gap:6px}
.q button{width:28px;height:28px;border-radius:6px;border:1px solid var(--ln);background:var(--bg)}
.sum{display:flex;justify-content:space-between;padding:4px 0}
.tot{font-size:22px;font-weight:800}
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0}
.chips button,.btn2{border:1px solid var(--ln);background:var(--bg);border-radius:20px;padding:5px 12px;font-size:13px}
.pay{width:100%;margin-top:10px;padding:13px;border:0;border-radius:10px;background:var(--go);color:var(--gox);font-weight:800;font-size:16px}
.pay:disabled{opacity:.45;cursor:not-allowed}
.link{border:0;background:none;color:var(--bad);font-size:13px}
.empty{color:var(--mut);padding:18px 0;text-align:center}
.f{display:grid;grid-template-columns:2fr 1fr 1fr 1fr auto;gap:8px;margin-bottom:12px}
@media(max-width:700px){.f{grid-template-columns:1fr 1fr}}
.add{border:0;background:var(--ac);color:var(--acx);border-radius:8px;padding:9px 16px;font-weight:600}
.stats{display:flex;gap:12px;margin-bottom:12px;flex-wrap:wrap}
.stats div{flex:1;min-width:140px}.stats span{color:var(--mut);font-size:13px;display:block}.stats b{font-size:20px}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.55);display:flex;align-items:center;justify-content:center;padding:16px;z-index:20}
.rc{background:#fff;color:#111;width:100%;max-width:320px;border-radius:6px;padding:18px;font:13px/1.5 ui-monospace,Menlo,Consolas,monospace;max-height:90vh;overflow:auto}
.rc hr{border:0;border-top:1px dashed #999;margin:8px 0}
.rc .l{display:flex;justify-content:space-between;gap:8px}
.rc .c{text-align:center}
.acts{display:flex;gap:8px;margin-top:12px}.acts button{flex:1;padding:9px;border-radius:8px;border:1px solid #bbb;background:#f3f3f3;color:#111}
.acts .main{background:#0f6e8c;color:#fff;border-color:#0f6e8c}
@media print{body *{visibility:hidden}.rc,.rc *{visibility:visible}.rc{position:absolute;left:0;top:0}.acts{display:none}}
</style>
</head>
<body>
<header>
  <h1>🧾 warung pak egy</h1>
  <nav role="tablist">
    <button role="tab" data-t="kasir" aria-selected="true">Kasir</button>
    <button role="tab" data-t="produk" aria-selected="false">Produk</button>
    <button role="tab" data-t="riwayat" aria-selected="false">Riwayat</button>
  </nav>
</header>
<main id="app"></main>
<div id="modal"></div>
<script>
const rp=n=>'Rp '+Math.round(n).toLocaleString('id-ID');
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const store={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
const seed=[
 {id:1,nama:'Nasi Goreng',harga:15000,stok:30,kat:'Makanan'},
 {id:2,nama:'Mie Ayam',harga:13000,stok:25,kat:'Makanan'},
 {id:3,nama:'Soto Ayam',harga:14000,stok:20,kat:'Makanan'},
 {id:4,nama:'Es Teh',harga:4000,stok:50,kat:'Minuman'},
 {id:5,nama:'Kopi Hitam',harga:6000,stok:40,kat:'Minuman'},
 {id:6,nama:'Jus Jeruk',harga:9000,stok:20,kat:'Minuman'},
 {id:7,nama:'Kerupuk',harga:2000,stok:60,kat:'Camilan'},
 {id:8,nama:'Pisang Goreng',harga:5000,stok:30,kat:'Camilan'}];
let produk=store.get('kasir_produk',seed), trx=store.get('kasir_trx',[]);
let cart={}, tab='kasir', q='', kat='Semua', diskon=0, bayar='', msg='';
const $=s=>document.querySelector(s), app=$('#app');
const save=()=>{store.set('kasir_produk',produk);store.set('kasir_trx',trx)};
const cartRows=()=>Object.entries(cart).map(([id,n])=>({p:produk.find(x=>x.id==id),n})).filter(r=>r.p);
const calc=()=>{const sub=cartRows().reduce((a,r)=>a+r.p.harga*r.n,0);const d=Math.round(sub*diskon/100);return{sub,d,tot:sub-d}};

function viewKasir(){
  const kats=['Semua',...new Set(produk.map(p=>p.kat))];
  const list=produk.filter(p=>(kat==='Semua'||p.kat===kat)&&p.nama.toLowerCase().includes(q.toLowerCase()));
  const {sub,d,tot}=calc(), rows=cartRows(), b=Number(bayar)||0, kem=b-tot;
  app.innerHTML=`<div class="kasir">
  <section class="panel"><div class="bar">
    <input id="cari" type="search" placeholder="Cari produk…" value="${esc(q)}" aria-label="Cari produk">
    <select id="kat" aria-label="Kategori">${kats.map(k=>`<option ${k===kat?'selected':''}>${esc(k)}</option>`).join('')}</select></div>
    <div class="grid">${list.map(p=>`<button class="item" data-add="${p.id}" ${p.stok<1?'disabled':''}><b>${esc(p.nama)}</b><span class="p">${rp(p.harga)}</span><small>${p.stok<1?'Stok habis':'Stok '+p.stok}</small></button>`).join('')||'<div class="empty">Produk tidak ditemukan.</div>'}</div>
  </section>
  <aside class="panel"><b>Keranjang</b>
    ${rows.length?rows.map(r=>`<div class="row"><div class="n">${esc(r.p.nama)}<small>${rp(r.p.harga)}</small></div>
      <div class="q"><button data-min="${r.p.id}" aria-label="Kurangi">−</button><span>${r.n}</span><button data-plus="${r.p.id}" aria-label="Tambah">+</button></div>
      <b>${rp(r.p.harga*r.n)}</b></div>`).join(''):'<div class="empty">Ketuk produk untuk menambahkan.</div>'}
    <div class="sum"><span>Subtotal</span><span>${rp(sub)}</span></div>
    <div class="sum"><label for="dis">Diskon (%)</label><input id="dis" type="number" min="0" max="100" value="${diskon}" style="width:70px;text-align:right"></div>
    ${d?`<div class="sum"><span>Potongan</span><span>− ${rp(d)}</span></div>`:''}
    <div class="sum tot"><span>Total</span><span>${rp(tot)}</span></div>
    <label for="byr">Uang diterima</label>
    <input id="byr" type="number" min="0" inputmode="numeric" value="${bayar}" style="width:100%;margin-top:4px">
    <div class="chips"><button data-uang="${tot}">Uang pas</button>${[20000,50000,100000].map(v=>`<button data-uang="${v}">${rp(v)}</button>`).join('')}</div>
    <div class="sum"><span>Kembalian</span><b style="color:${kem<0&&b?'var(--bad)':'inherit'}">${b?(kem<0?'Kurang '+rp(-kem):rp(kem)):'–'}</b></div>
    <button class="pay" id="bayar" ${rows.length&&b>=tot?'':'disabled'}>Bayar</button>
    ${rows.length?'<button class="link" id="kosong" style="margin-top:8px">Kosongkan keranjang</button>':''}
    <div style="color:var(--bad);font-size:13px">${esc(msg)}</div>
  </aside></div>`;
  $('#cari').oninput=e=>{q=e.target.value;viewKasir();const i=$('#cari');i.focus();i.setSelectionRange(q.length,q.length)};
  $('#kat').onchange=e=>{kat=e.target.value;viewKasir()};
  $('#dis').onchange=e=>{diskon=Math.min(100,Math.max(0,Number(e.target.value)||0));viewKasir()};
  $('#byr').onchange=e=>{bayar=e.target.value;viewKasir()};
  app.querySelectorAll('[data-add]').forEach(el=>el.onclick=()=>{const id=el.dataset.add,p=produk.find(x=>x.id==id);if((cart[id]||0)<p.stok){cart[id]=(cart[id]||0)+1;msg=''}else msg='Stok '+p.nama+' tidak cukup.';viewKasir()});
  app.querySelectorAll('[data-plus]').forEach(el=>el.onclick=()=>{const id=el.dataset.plus,p=produk.find(x=>x.id==id);if(cart[id]<p.stok)cart[id]++;else msg='Stok '+p.nama+' tidak cukup.';viewKasir()});
  app.querySelectorAll('[data-min]').forEach(el=>el.onclick=()=>{const id=el.dataset.min;if(--cart[id]<1)delete cart[id];msg='';viewKasir()});
  app.querySelectorAll('[data-uang]').forEach(el=>el.onclick=()=>{bayar=String(el.dataset.uang);viewKasir()});
  const k=$('#kosong');if(k)k.onclick=()=>{cart={};bayar='';viewKasir()};
  $('#bayar').onclick=()=>{
    const c=calc(),items=cartRows().map(r=>({nama:r.p.nama,harga:r.p.harga,n:r.n}));
    cartRows().forEach(r=>r.p.stok-=r.n);
    const t={id:Date.now(),waktu:new Date().toISOString(),items,sub:c.sub,diskon:c.d,total:c.tot,bayar:Number(bayar),kembali:Number(bayar)-c.tot};
    trx.unshift(t);save();cart={};bayar='';diskon=0;msg='';struk(t);viewKasir();
  };
}

function struk(t){
  const w=new Date(t.waktu).toLocaleString('id-ID');
  $('#modal').innerHTML=`<div class="ov"><div><div class="rc"><div class="c"><b>KASIR WARUNG</b><br>${w}<br>No. ${String(t.id).slice(-6)}</div><hr>
  ${t.items.map(i=>`<div>${esc(i.nama)}</div><div class="l"><span>${i.n} x ${rp(i.harga)}</span><span>${rp(i.n*i.harga)}</span></div>`).join('')}<hr>
  <div class="l"><span>Subtotal</span><span>${rp(t.sub)}</span></div>
  ${t.diskon?`<div class="l"><span>Diskon</span><span>-${rp(t.diskon)}</span></div>`:''}
  <div class="l"><b>Total</b><b>${rp(t.total)}</b></div>
  <div class="l"><span>Tunai</span><span>${rp(t.bayar)}</span></div>
  <div class="l"><span>Kembali</span><span>${rp(t.kembali)}</span></div><hr><div class="c">Terima kasih!</div>
  <div class="acts"><button id="cetak">Cetak</button><button class="main" id="tutup">Transaksi baru</button></div></div></div></div>`;
  $('#tutup').onclick=()=>{$('#modal').innerHTML=''};
  $('#cetak').onclick=()=>{try{window.print()}catch(e){}};
}

function viewProduk(){
  app.innerHTML=`<section class="panel"><b>Tambah produk</b>
  <form id="fp" class="f" onsubmit="return false" style="margin-top:8px">
   <input id="pn" placeholder="Nama produk" aria-label="Nama produk">
   <input id="ph" type="number" min="0" placeholder="Harga" aria-label="Harga">
   <input id="ps" type="number" min="0" placeholder="Stok" aria-label="Stok">
   <input id="pk" placeholder="Kategori" aria-label="Kategori" list="kl">
   <button class="add" id="simpan" type="button">Simpan</button></form>
  <datalist id="kl">${[...new Set(produk.map(p=>p.kat))].map(k=>`<option value="${esc(k)}">`).join('')}</datalist>
  <div style="color:var(--bad);font-size:13px;min-height:18px" id="err"></div>
  ${produk.length?produk.map(p=>`<div class="row"><div class="n">${esc(p.nama)}<small>${esc(p.kat)} · ${rp(p.harga)}</small></div>
   <label class="q">Stok <input type="number" min="0" value="${p.stok}" data-stok="${p.id}" style="width:80px"></label>
   <button class="link" data-del="${p.id}">Hapus</button></div>`).join(''):'<div class="empty">Belum ada produk. Isi form di atas untuk menambah.</div>'}
  </section>`;
  $('#simpan').onclick=()=>{
    const nama=$('#pn').value.trim(),harga=Number($('#ph').value),stok=Number($('#ps').value)||0,k=$('#pk').value.trim()||'Lainnya';
    if(!nama||!(harga>0)){$('#err').textContent='Isi nama dan harga lebih dari 0.';return}
    produk.push({id:Date.now(),nama,harga,stok,kat:k});save();viewProduk();
  };
  app.querySelectorAll('[data-stok]').forEach(el=>el.onchange=()=>{const p=produk.find(x=>x.id==el.dataset.stok);p.stok=Math.max(0,Number(el.value)||0);save()});
  app.querySelectorAll('[data-del]').forEach(el=>el.onclick=()=>{if(confirm('Hapus produk ini?')){produk=produk.filter(x=>x.id!=el.dataset.del);delete cart[el.dataset.del];save();viewProduk()}});
}

function viewRiwayat(){
  const hari=new Date().toDateString(),hi=trx.filter(t=>new Date(t.waktu).toDateString()===hari);
  const omzet=hi.reduce((a,t)=>a+t.total,0);
  app.innerHTML=`<section class="panel"><div class="stats">
   <div><span>Omzet hari ini</span><b>${rp(omzet)}</b></div><div><span>Transaksi hari ini</span><b>${hi.length}</b></div><div><span>Total semua transaksi</span><b>${trx.length}</b></div></div>
   ${trx.length?trx.map(t=>`<div class="row"><div class="n">No. ${String(t.id).slice(-6)}<small>${new Date(t.waktu).toLocaleString('id-ID')} · ${t.items.reduce((a,i)=>a+i.n,0)} item</small></div><b>${rp(t.total)}</b><button class="btn2" data-lihat="${t.id}">Struk</button></div>`).join(''):'<div class="empty">Belum ada transaksi. Selesaikan pembayaran di tab Kasir.</div>'}
   ${trx.length?'<button class="link" id="reset" style="margin-top:12px">Hapus semua riwayat</button>':''}</section>`;
  app.querySelectorAll('[data-lihat]').forEach(el=>el.onclick=()=>struk(trx.find(t=>t.id==el.dataset.lihat)));
  const r=$('#reset');if(r)r.onclick=()=>{if(confirm('Hapus seluruh riwayat transaksi?')){trx=[];save();viewRiwayat()}};
}

function render(){({kasir:viewKasir,produk:viewProduk,riwayat:viewRiwayat})[tab]()}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{tab=b.dataset.t;document.querySelectorAll('nav button').forEach(x=>x.setAttribute('aria-selected',x===b));render()});
render();
</script>
</body>
</html>
